name: web-pug

description: Server-rendered web application using Pug.

language: typescript
runtime: node
backend: express
api: rest-json
database: postgres
frontend: pug

testing:
  unit: vitest
  browser: playwright

# The Targets in scope for an application on this stack (method/targets/); the application may drop what it does not use.
targets:
  - business-requirements
  - architecture
  - application-design
  - api-design
  - ui-design
  - persistence-design
  - api
  - persistence
  - server
  - web-ui
  - testing
  - evidence
  - documentation
  - deployment
  - dev-setup
  - run-app
