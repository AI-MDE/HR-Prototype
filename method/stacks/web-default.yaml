name: web-default

description: Default full-stack web application starting point.

language: typescript
runtime: node
backend: express
api: rest-json
database: postgres
frontend: react
build: vite

testing:
  unit: vitest
  browser: playwright

# The Targets in scope for an application on this stack (method/targets/); the application may drop what it does not use.
targets:
  - business-requirements
  - architecture
  - application-design
  - api-design
  - ui-design
  - persistence-design
  - api
  - persistence
  - server
  - web-ui
  - testing
  - evidence
  - documentation
  - deployment
  - dev-setup
  - run-app
